name: update flake.lock

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/determinate-nix-action@v3
      - run: nix flake update
      # Evaluate the new lock before opening the PR. A PR opened with the
      # default GITHUB_TOKEN does not trigger check.yml itself, so this is the
      # check for it. Set a FLAKE_UPDATE_TOKEN repo secret (a PAT with repo
      # scope) to have check.yml run on the PR as well.
      - run: ./check.sh
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || secrets.GITHUB_TOKEN }}
          branch: ci/update-flake-lock
          delete-branch: true
          commit-message: "flake: update inputs"
          title: "flake: update inputs"
          body: |
            Weekly `nix flake update`. `check.sh` evaluated every target on this lock before the PR was opened.

            Merge, then `./rebuild.sh` on each machine.
